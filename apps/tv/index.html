<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AnimBook TV</title>
    <style>
      :root {
        --bg: #080c14;
        --surface: #0d1b2e;
        --card: #111d19;
        --gold: #c49a1c;
        --text: #f5edd8;
        --text-muted: #8a9e96;
        --border: #1e2e28;
        --focus: #c49a1c;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--bg);
        color: var(--text);
        font-family: "Cormorant Garamond", "Times New Roman", serif;
        font-size: 32px;
        line-height: 1.45;
        min-height: 100vh;
        overflow-x: hidden;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      button,
      a {
        font: inherit;
        color: inherit;
        text-decoration: none;
      }
      button {
        background: transparent;
        border: none;
        cursor: pointer;
      }
      .focusable {
        outline: none;
        border: 3px solid transparent;
        border-radius: 16px;
        transition: border-color 0.18s, box-shadow 0.18s, transform 0.18s;
      }
      .focusable.is-focused,
      .focusable:focus,
      .focusable:hover {
        border-color: var(--focus);
        box-shadow: 0 0 0 6px rgba(196, 154, 28, 0.25);
        transform: scale(1.04);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
