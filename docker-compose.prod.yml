# AnimBook — production stack.
#
# Bring it up after you've filled in apps/api/.env.production and
# apps/web/.env.production.
#
#   docker compose -f docker-compose.prod.yml --env-file apps/api/.env.production up -d
#
# Reverse-proxy in front of this with Caddy / Traefik / your cloud's LB.
# On Railway / Render / Fly you usually skip this file and let the platform
# provision Postgres + Redis as managed add-ons. This file is for
# self-hosted (Hetzner, bare metal, single-VM staging).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-animbook}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-animbook_local}
      POSTGRES_DB: animbook
    volumes:
      - animbook-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-animbook} -d animbook"]
      interval: 10s
      timeout: 3s
      retries: 6
    ports:
      - "6000:5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - animbook-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 6
    ports:
      - "6001:6379"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - apps/api/.env.production
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/api/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE: ${NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE:-0.1}
        NEXT_PUBLIC_RELEASE: ${NEXT_PUBLIC_RELEASE:-animbook-web@0.11.0}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Mobile + TV shells — Expo web export + Vite build served by nginx.
  mobile:
    build:
      context: .
      dockerfile: apps/mobile/Dockerfile
    restart: unless-stopped
    ports:
      - "3005:80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3

  tv:
    build:
      context: .
      dockerfile: apps/tv/Dockerfile
    restart: unless-stopped
    ports:
      - "3006:80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  animbook-postgres:
  animbook-redis:
